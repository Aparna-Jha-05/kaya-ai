name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specs:
    name: OpenSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate every active change
        run: |
          for change_dir in openspec/changes/*; do
            npx --yes @fission-ai/openspec@1.3.1 validate "$(basename "$change_dir")" --strict
          done

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-test.txt
      - name: Compile Python sources
        run: python -m compileall -q backend scripts
      - name: Run backend unit tests
        env:
          OLLAMA_ENABLED: "false"
          REMOTE_EXTRACTION_ENABLED: "false"
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
      - name: Verify deterministic extraction baseline
        run: PYTHONPATH=backend python scripts/evaluate_extraction.py --assert-baseline
      - name: Run deterministic pipeline smoke
        run: |
          python scripts/seed_demo_data.py
          PYTHONPATH=backend python scripts/test_pipeline.py
      - name: Verify current API contract
        run: >-
          PYTHONPATH=backend python -c
          'from main import app; paths = app.openapi()["paths"];
          assert {"/", "/api/v1/bids/upload", "/api/v1/bids/simulate"} <= set(paths)'

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
