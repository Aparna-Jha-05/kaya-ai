services:
  - type: web
    name: po-lice-backend-staging
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: python -m pip install -r backend/requirements.txt
    startCommand: PYTHONPATH=backend uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    buildFilter:
      paths:
        - backend/**
        - scripts/**
        - render.yaml
    envVars:
      - key: PO_LICE_ALLOWED_ORIGINS
        sync: false
