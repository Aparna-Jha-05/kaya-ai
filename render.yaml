services:
  - type: web
    name: po-lice-backend-staging
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r backend/requirements.txt
    startCommand: PYTHONPATH=backend uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    buildFilter:
      paths:
        - backend/**
        - scripts/**
        - render.yaml
    envVars:
      - key: PO_LICE_ALLOWED_ORIGINS
        sync: false
      - key: PO_LICE_PROJECT_ID
        value: PRJ-POLICE-01
      - key: PO_LICE_PUBLIC_READ_ONLY
        value: "true"
      - key: OLLAMA_ENABLED
        value: "false"
      - key: REMOTE_EXTRACTION_ENABLED
        value: "false"
